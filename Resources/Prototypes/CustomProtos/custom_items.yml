# Naming System:

# Custom Content Prefix: in this case, it is always "Awsm". Prepended to the whole ID for easy searching, spawning, and testing, as well as to ensure no conflicts with upstream merges or vanilla items.
# Requester: Part of the item prefix. First name of the character who will be making primary use of this item. Should be 4 or 5 letters, depending on the context.
# Root Item ID: Follows base game naming scheme. Usually just a slight alteration of the item it is based on.
# Suffix: Usually not used. In the case of joke or admin items, the suffix "Admeme" should be used.
# Name: Should be the item's name, with the intended user's name prepended before it. May have modifications to differentiate it from vanilla and to express what has been modified.
# Description: Usually a modification of the base item. Often contains lore and roleplay information. Some information from vanilla should be removed or rewritten to avoid redundancy.

# Example: 
# name: Annabelle's Harm Baton
# id: AwsmBelleHarmbaton
# description: A harm baton for harming people with. Modified for use by Annabelle.

# The base item in this case is the stun baton (Stunbaton). 
# This item was suggested by Emrald for use by Annabelle, thus "Annabelle's" is prepended before the item name.
# This item is modified to do more damage when deactivated, and Emrald had picked the name Harm Baton, so the name and Root ID are changed from stun baton (Stunbaton) to Harm Baton (Harmbaton).
# Yes I know my item name capitalization is different than the base items, as mine are usually capitalized evey word, as vanilla items are typically all lowercase. I just think it looks better, alright?
# Awsm is prepended to the ID for easy identification and categorization of custom items.
# Belle is added before the Root ID to signify that this item belongs to Annabelle. (Shortened to Belle to differentiate it from Anna's items.)
# The Root Item ID, as previously mentioned, is changed to express the differences in the item. 
# The base stun baton's description is "A stun baton for incapacitating people with. Has advanced wrist strap technology to prevent cadets accidentally dropping it."
# The second sentence is removed to avoid redundancy, stun and incapacitating are substituted with harm and harming, and it is noted that it is modified for specific usage by Annabelle.

# Exceptions:

# In the case of joke items, the Name and Description rules may be ignored.
# In the case of items with no specific intended user, the Requester field may be ignored, as the Custom Content Prefix still ensures proper categorization.





