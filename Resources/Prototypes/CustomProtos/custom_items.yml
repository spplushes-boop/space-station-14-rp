#Requested by Annabelle
- type: entity
  name: Annabelle's Harm Baton
  parent: [BaseItem, BaseSecurityContraband]
  id: AwsmBelleHarmbaton
  description: A harm baton for harming people with. Modified for use by Annabelle.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/stunbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: ItemToggleExaminableStatus
  - type: ItemToggle
    onActivate: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemTogglePrefix
    prefixOn: on
    prefixOff: off
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 0
        Structural: 0
  - type: MeleeWeapon
    attackRate: 1.3
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 20
        Structural: 20
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
    undamagedAlertThreshold: 0
  - type: MeleeBatteryHitsLeft
  - type: StaminaDamageOnHitRequiresToggle
  - type: StaminaDamageOnHit
    damage: 40
    sound: /Audio/Weapons/egloves.ogg
  - type: StaminaDamageOnCollide
    damage: 40
    sound: /Audio/Weapons/egloves.ogg
  - type: LandAtCursor # it deals stamina damage when thrown
  - type: UseDelay
  - type: Item
    heldPrefix: off
    size: Normal
  - type: Clothing
    sprite: Objects/Weapons/Melee/stunbaton.rsi
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: stunbaton_on}
          False: {state: stunbaton_off}
  - type: StaticPrice
    price: 80
  - type: Riggable
  - type: Explosive
    explosionType: Default
    intensitySlope: 1.5
    maxIntensity: 200
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: Tag
    tags:
    - Stunbaton
  - type: PreventForcedThrow

